<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack Tower</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .back-button {
      position: fixed;
      top: 10px;
      left: 10px;
      background: #ff5252;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      text-decoration: none;
      z-index: 1000;
    }

    .game-container {
      position: relative;
      width: 90vmin;
      height: 90vmin;
      max-width: 500px;
      max-height: 500px;
      background: #000; /* ✅ Sfondo nero */
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(to top, #ff5f6d, #ffc371);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 15px;
      cursor: pointer;
    }

    h1 {
      margin-bottom: 10px;
    }

    .return-link {
      margin-top: 10px;
      display: inline-block;
      background-color: #333;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <a href="app.html" class="back-button">⬅ Torna all'App</a>

  <div class="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
      <h1>Stack Tower</h1>
      <p>Allinea i blocchi e costruisci la torre!</p>
      <button onclick="startGame()">Start</button>
      <a href="app.html#minigames" class="return-link">⬅️ Torna all'App</a>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="overlay" style="display:none;">
      <h1>Game Over</h1>
      <p id="scoreText"></p>
      <button onclick="startGame()">Rigioca</button>
      <a href="app.html#minigames" class="return-link">⬅️ Torna all'App</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startScreen = document.getElementById("startScreen");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const scoreText = document.getElementById("scoreText");

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let stack = [];
    const blockHeight = 30;
    let currentBlock, direction, speed, score, gameRunning;
    let cameraOffsetY = 0;

    function randomColor() {
      const colors = [
        '#ff3f34', '#05c46b', '#0fbcf9', '#ffc048',
        '#ffdd59', '#575fcf', '#f53b57', '#34e7e4', '#ffffff'
      ];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function createBlock(y, width) {
      return {
        x: 0,
        y: y,
        width: width,
        color: randomColor()
      };
    }

    function startGame() {
      resizeCanvas();

      const initialWidth = canvas.width / 3;
      cameraOffsetY = 0;

      stack = [{
        x: canvas.width / 2 - initialWidth / 2,
        y: canvas.height - blockHeight,
        width: initialWidth,
        color: "#fff"
      }];

      currentBlock = createBlock(stack[0].y - blockHeight, initialWidth);
      currentBlock.x = 0;

      direction = 1;
      speed = 4;
      score = 0;
      gameRunning = true;

      startScreen.style.display = "none";
      gameOverScreen.style.display = "none";
      requestAnimationFrame(gameLoop);
    }

    function endGame() {
      gameRunning = false;
      scoreText.textContent = `Punteggio: ${score}`;
      gameOverScreen.style.display = "flex";
    }

    function placeBlock() {
      if (!gameRunning) return;

      const lastBlock = stack[stack.length - 1];
      const overlap = Math.min(
        currentBlock.x + currentBlock.width,
        lastBlock.x + lastBlock.width
      ) - Math.max(currentBlock.x, lastBlock.x);

      if (overlap > 0) {
        const newWidth = overlap;
        const newX = Math.max(currentBlock.x, lastBlock.x);
        const shrinkFactor = 0.96;
        const finalWidth = Math.max(newWidth * shrinkFactor, 10);

        stack.push({
          x: newX + (newWidth - finalWidth) / 2,
          y: currentBlock.y,
          width: finalWidth,
          color: currentBlock.color
        });

        // 🔼 Sposta la visuale verso l’alto
        if (currentBlock.y < canvas.height / 2) {
          cameraOffsetY += blockHeight;
        }

        // Nuovo blocco sopra
        currentBlock = createBlock(currentBlock.y - blockHeight, finalWidth);
        currentBlock.x = 0;
        direction = 1;
        score++;
      } else {
        endGame();
      }
    }

    function drawBlock(x, y, width, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y + cameraOffsetY, width, blockHeight);
    }

    function gameLoop() {
      if (!gameRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      currentBlock.x += speed * direction;
      if (currentBlock.x + currentBlock.width >= canvas.width || currentBlock.x <= 0) {
        direction *= -1;
      }

      for (let block of stack) {
        drawBlock(block.x, block.y, block.width, block.color);
      }

      drawBlock(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.color);

      ctx.fillStyle = "white";
      ctx.font = "16px Arial";
      ctx.fillText("Punteggio: " + score, 10, 20);

      requestAnimationFrame(gameLoop);
    }

    canvas.addEventListener("touchstart", placeBlock);
    canvas.addEventListener("mousedown", placeBlock);
  </script>
</body>
</html>
