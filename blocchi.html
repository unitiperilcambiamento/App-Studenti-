<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stack Tower</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .back-button {
            position: fixed;
            top: 10px;
            left: 10px;
            background: #ff5252;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            text-decoration: none;
            z-index: 1000;
        }

        .game-container {
            position: relative;
            width: 90vmin;
            height: 90vmin;
            max-width: 500px;
            max-height: 500px;
            background: #000000; /* sfondo nero */
            border: 3px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000000;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        
        .overlay.hidden {
            display: none;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 15px;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 10px;
        }

        .return-link {
            margin-top: 10px;
            display: inline-block;
            background-color: #333;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <a href="app.html" class="back-button">⬅ Torna all'App</a>
    <div class="main-container">
        <div class="game-container">
            <canvas id="gameCanvas"></canvas>

            <div id="startScreen" class="overlay">
                <h1>Stack Tower</h1>
                <p>Allinea i blocchi e costruisci la torre!</p>
                <button id="startButton">Start</button>
                <a href="app.html#minigames" class="return-link">⬅️ Torna all'App</a>
            </div>

            <div id="gameOverScreen" class="overlay hidden">
                <h1>Game Over</h1>
                <p id="scoreText"></p>
                <button id="restartButton">Rigioca</button>
                <a href="app.html#minigames" class="return-link">⬅️ Torna all'App</a>
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startScreen = document.getElementById("startScreen");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const scoreText = document.getElementById("scoreText");
        const startButton = document.getElementById("startButton");
        const restartButton = document.getElementById("restartButton");

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        let stack = [];
        const blockHeight = 30;
        let currentBlock, direction, score, gameRunning, lastTime;
        let cameraOffsetY = 0;

        function randomColor() {
            const colors = [
                '#ff3f34', '#05c46b', '#0fbcf9', '#ffc048',
                '#ffdd59', '#575fcf', '#f53b57', '#34e7e4', '#ffffff'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function createBlock(y, width) {
            return {
                x: 0,
                y: y,
                width: width,
                color: randomColor()
            };
        }

        function getSpeed() {
            return 4 + Math.min(score * 0.2, 5);
        }

        function startGame() {
            resizeCanvas();

            const initialWidth = canvas.width / 3;
            cameraOffsetY = 0;
            score = 0;
            gameRunning = true;
            lastTime = null;

            stack = [{
                x: canvas.width / 2 - initialWidth / 2,
                y: canvas.height - blockHeight,
                width: initialWidth,
                color: "#fff"
            }];

            currentBlock = createBlock(stack[0].y - blockHeight, initialWidth);
            
            direction = (Math.random() > 0.5) ? 1 : -1;
            currentBlock.x = (direction === 1) ? -currentBlock.width : canvas.width;
            
            startScreen.classList.add("hidden");
            gameOverScreen.classList.add("hidden");
            
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            scoreText.textContent = `Punteggio: ${score}`;
            gameOverScreen.classList.remove("hidden");
        }

        function placeBlock() {
            if (!gameRunning) return;

            const lastBlock = stack[stack.length - 1];
            const overlap = Math.min(
                currentBlock.x + currentBlock.width,
                lastBlock.x + lastBlock.width
            ) - Math.max(currentBlock.x, lastBlock.x);

            if (overlap > 0) {
                const newWidth = overlap;
                const newX = Math.max(currentBlock.x, lastBlock.x);

                stack.push({
                    x: newX,
                    y: currentBlock.y,
                    width: newWidth,
                    color: currentBlock.color
                });

                // La camera sale se il blocco sale sopra metà schermo (considerando l'offset)
                if (currentBlock.y + cameraOffsetY < canvas.height / 2) {
                    cameraOffsetY += blockHeight;
                }

                currentBlock = createBlock(currentBlock.y - blockHeight, newWidth);
                currentBlock.x = (direction === 1) ? -newWidth : canvas.width;
                direction *= -1;
                score++;

            } else {
                endGame();
            }
        }

        function drawBlock(x, y, width, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y + cameraOffsetY, width, blockHeight);
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;

            if (!lastTime) lastTime = timestamp;
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            const speed = getSpeed();
            const moveDistance = speed * (deltaTime / 16.67);

            currentBlock.x += moveDistance * direction;
            if (currentBlock.x + currentBlock.width > canvas.width) {
                currentBlock.x = canvas.width - currentBlock.width;
                direction *= -1;
            } else if (currentBlock.x < 0) {
                currentBlock.x = 0;
                direction *= -1;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let block of stack) {
                drawBlock(block.x, block.y, block.width, block.color);
            }

            drawBlock(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.color);

            ctx.fillStyle = "white";
            ctx.font = "16px Arial";
            ctx.fillText("Punteggio: " + score, 10, 20);

            requestAnimationFrame(gameLoop);
        }

        startButton.addEventListener("click", startGame);
        restartButton.addEventListener("click", startGame);
        canvas.addEventListener("click", placeBlock);
    </script>
</body>
</html>
