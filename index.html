<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installa l'App</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --main-color: #22c55e;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
        }
        .logo-image {
            max-width: 150px; /* Regola la dimensione dell'immagine come preferisci */
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-weight: bold; /* Titolo in grassetto */
        }
        p {
            color: #555;
            margin-bottom: 30px;
            max-width: 400px;
        }
        #installButton {
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            background-color: var(--main-color);
            color: white;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }
        #installButton:hover {
            background-color: #1e8745;
        }
        .ios-instructions {
            margin-top: 30px;
            padding: 15px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            border-radius: 8px;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <img src="1.png" alt="Logo App" class="logo-image">
    <h1>Aggiungi l'App Studenti alla tua Home!</h1>
    <p>Clicca il pulsante qui sotto per installare la nostra App sul tuo dispositivo. Avrai accesso rapido a tutte le funzionalità senza passare dal browser.</p>
    
    <button id="installButton">
        📲 Aggiungi alla Home
    </button>
    
    <div id="iosMessage"></div>
    
    <script>
        let deferredPrompt;
        const installButton = document.getElementById('installButton');
        const iosMessageContainer = document.getElementById('iosMessage');

        // 1. Logica per Android/Chrome (Gestione del prompt di installazione)
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); 
            deferredPrompt = e; 
            // Mostriamo sempre il pulsante, ma il codice in basso lo nasconde se l'app è già installata.
            installButton.style.display = 'block'; 
            console.log("Evento beforeinstallprompt intercettato.");
        });

        // 2. Associa la funzione di installazione al pulsante
        installButton.addEventListener('click', (e) => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); 
                // Registra la scelta (opzionale)
                deferredPrompt.userChoice.then((choiceResult) => {
                    console.log('Scelta utente:', choiceResult.outcome);
                    deferredPrompt = null;
                    if (choiceResult.outcome === 'accepted') {
                        installButton.textContent = '✅ App installata!';
                        installButton.disabled = true;
                    }
                });
            } else {
                 alert("La funzionalità di installazione non è disponibile in questo momento o l'app è già installata. Prova a ricaricare la pagina o segui le istruzioni manuali.");
            }
        });

        // 3. Fallback e Istruzioni per iOS/Safari
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        
        // Se non c'è il prompt programmabile E siamo su iOS
        if (isIOS) {
            installButton.style.display = 'none'; // Nasconde il pulsante non funzionante su iOS
            iosMessageContainer.className = 'ios-instructions';
            iosMessageContainer.innerHTML = 'Su **iPhone/iPad (Safari)**, l\'installazione è manuale. Clicca l\'icona **Condividi** (il quadrato con la freccia in basso) nel browser e poi scegli **"Aggiungi alla schermata Home"**.';
        } else if (('standalone' in navigator) && navigator.standalone) {
             // L'app è già avviata come standalone (già installata come PWA)
             installButton.textContent = '✅ App già installata!';
             installButton.disabled = true;
             installButton.style.backgroundColor = '#6c757d';
        }
    </script>
</body>
</html>
